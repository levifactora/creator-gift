<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Creator CRM</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f3ee; --ink: #1b1a17; --muted: #736e64; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141310; --ink: #f3efe7; --muted: #a39d91; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-align: center; }
    h1 { margin: 0 0 8px; font: 500 34px/1.1 ui-serif, "New York", Georgia, serif; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main><h1 id="title">You’re all set</h1><p id="text">You can close this tab and go back to Creator CRM.</p></main>
  <script>
    const query = new URLSearchParams(location.search);
    const MESSAGES = {
      'printful:connected': ['Printful is connected', 'Close this tab and refresh Creator CRM Settings.'],
      'printful:declined': ['Printful wasn’t connected', 'You can try again from Creator CRM Settings.'],
      'printful:failed': ['That didn’t work', 'Please try connecting Printful again from Creator CRM Settings.'],
      'billing:done': ['Thanks for subscribing', 'Close this tab and go back to Creator CRM.'],
      'billing:cancelled': ['No charge was made', 'You can subscribe any time from Creator CRM Settings.'],
    };
    const key = query.has('printful') ? `printful:${query.get('printful')}` : `billing:${query.get('billing')}`;
    if (Object.hasOwn(MESSAGES, key)) {
      document.getElementById('title').textContent = MESSAGES[key][0];
      document.getElementById('text').textContent = MESSAGES[key][1];
    }
  </script>
</body>
</html>
